site_name: OpenDecision
site_description: Open-source semantic decision engine for structured state and documents
site_url: https://deepanwadhwa.github.io/OpenDecision/
repo_url: https://github.com/deepanwadhwa/OpenDecision
repo_name: deepanwadhwa/OpenDecision
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font: false
  features:
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: custom
    accent: custom

nav:
  - Introduction: index.md
  - Get started: quickstart.md
  - Primitives: primitives.md
  - Document decisions: document-decisions.md
  - Evidence and rules: evidence-and-rules.md
  - Examples: examples.md
  - Maintainer guide: publishing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deepanwadhwa/OpenDecision
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/OpenDecision/

copyright: OpenDecision, Apache 2.0
